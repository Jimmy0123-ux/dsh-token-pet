name: Feature request
description: Suggest a focused improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful product behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Pet and animations
        - Context and usage panel
        - Lifetime Ledger and trends
        - Prompt enhancement
        - Settings and layout
        - Packaging and marketplace
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints or compatibility concerns
